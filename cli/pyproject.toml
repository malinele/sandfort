[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sandfort-cli"
dynamic = ["version"]
description = "Command line interface for the Sandfort sandbox platform"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # The help layout and the usage error style are tested against the 0.27 line; the next
    # minor release changes both, so it is excluded until the CLI is checked against it.
    "typer<0.28",
    "rich",
    "sandfort-sdk",
]

[project.scripts]
sandfort = "sandfort_cli.main:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = ".."
relative_to = "pyproject.toml"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
fallback_version = "0.1.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/sandfort_cli"]
# Written by the release tooling just before the build and removed afterwards; listed as an
# artifact so it ships even if a VCS ignore rule ever matches it.
artifacts = ["src/sandfort_cli/_build_info.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
