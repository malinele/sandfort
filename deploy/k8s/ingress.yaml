# Example Ingress for ingress-nginx with TLS. Replace the hosts and the TLS secret names.
# The TLS secrets (type kubernetes.io/tls) must exist in the sandfort namespace, for example
# issued by cert-manager. Set SANDFORT_FORWARDED_ALLOW_IPS in configmap.yaml to the addresses
# the controller connects from, or websocket URLs come out as ws:// instead of wss://.
#
# Long-lived connections: SSE log follows, async command logs and terminals (websocket) stay
# open and idle for long periods. ingress-nginx closes idle proxied connections after 60 s by
# default, so the timeouts below are raised to one hour; buffering is off so SSE events are
# delivered as they are produced. Websocket upgrades need no extra annotation on ingress-nginx.
#
# The 413 snippet below gives an oversize request the same JSON envelope as the API. The live
# hosted-beta ingress is not kept in this repo: apply the same three settings there — the body
# size, proxy-request-buffering "off" and the 413 snippet. Request buffering off is required for the server's pre-body 413: a
# Content-Length over the server cap but under the edge limit (256 MiB + 1) otherwise sits in
# the edge buffer and gets no answer until the whole body arrives.
#
# /metrics is unauthenticated (docs/operations.md). The server-snippet answers 404 for it at
# the edge. Recent ingress-nginx releases disable snippet annotations by default
# (allow-snippet-annotations); if yours does, block /metrics another way (for example a
# separate deny rule in the controller configuration) and keep monitoring on the cluster
# network only.
#
# Access logs: the pty websocket on the api host carries a single use connect `token`, a
# preview URL carries `sandfort_preview_token`, and so does the web terminal URL
# (`GET /terminal?token=`) wherever you route it. The server never logs these values (its
# lines show REDACTED), but the controller logs the raw request line and the server cannot
# change that. Both Ingresses below turn the controller's access log off
# (`enable-access-log: "false"`); the server still logs one line per request. Do the same on
# any Ingress that routes `/terminal`.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandfort-api
  namespace: sandfort
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # File uploads go through this ingress. The server caps an upload at 256 MiB and answers
    # larger ones itself with the JSON envelope, so the edge allows 1 MiB more (257m) and
    # refuses anything bigger at once, before it reads the body. Without a limit near the
    # server's own, a 257-512 MiB upload is streamed to the server and gets no answer for
    # seconds, and a body past the edge limit gets nginx's HTML 413 page.
    nginx.ingress.kubernetes.io/proxy-body-size: "257m"
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /metrics { return 404; }
      error_page 413 @sandfort_payload_too_large;
      location @sandfort_payload_too_large {
        internal;
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        return 413 '{"success":false,"data":null,"error":{"code":"PAYLOAD_TOO_LARGE","message":"request body is too large","details":{},"request_id":null},"meta":null}';
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sandfort.example.com
      secretName: sandfort-api-tls
  rules:
    - host: sandfort.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sandfort-api
                port:
                  name: http
---
# Preview proxy: <port>-<sandbox-id>.<SANDFORT_PREVIEW_DOMAIN>. The host below is a wildcard
# for SANDFORT_PREVIEW_DOMAIN in configmap.yaml, so the DNS record and the certificate must
# be wildcards too (*.preview.sandfort.example.com). Previews serve dev servers over http and
# websockets, so the same long timeouts apply.
# Bodies: a request body reaches the sandbox app, and ingress-nginx refuses a body over 1 MiB
# by default with its HTML 413 page. The preview proxy has no body cap of its own, so
# proxy-body-size below is the only limit. 512m is the value the hosted beta uses. Lower it
# if your previews never take large uploads.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandfort-preview
  namespace: sandfort
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    nginx.ingress.kubernetes.io/enable-access-log: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "*.preview.sandfort.example.com"
      secretName: sandfort-preview-tls
  rules:
    - host: "*.preview.sandfort.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sandfort-api
                port:
                  name: preview
