# sandfort.dev: key landing.conf of the ConfigMap sandfort-static-nginx.
# Deploy with: deploy/redeploy-beta.sh nginx
#
# Cache rules use `expires` and not add_header: add_header inside a location would drop the
# security headers inherited from the server block.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    set $csp "script-src 'self' https://umami.sandfort.dev;";
    set $csp "${csp} style-src 'self' 'unsafe-inline';";
    set $csp "${csp} font-src 'self'; img-src 'self' data:;";
    set $csp "${csp} connect-src 'self' https://umami.sandfort.dev;";
    set $csp "${csp} base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp always;

    error_page 404 /404.html;

    # The not-found page is not a page of its own: a direct request for /404 or /404.html
    # answers 404 (internal locations refuse outside requests), and error_page above still
    # serves the page, with status 404, for every miss. The page is never cached.
    location = /404 { internal; }
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
    }

    location ~* \.(json|js)$ {
        expires 1d;
    }

    location ~* \.html$ {
        expires epoch;
    }

    # Crawler files (site/robots.txt, site/llms.txt, site/sitemap.xml): the media type and the
    # charset are set here and do not depend on the image's mime.types. Short cache, so a
    # changed sitemap reaches crawlers within the hour. No add_header, as above.
    location ~ ^/(robots|llms)\.txt$ {
        types { }
        default_type text/plain;
        charset utf-8;
        expires 1h;
    }

    location = /sitemap.xml {
        types { }
        default_type application/xml;
        charset utf-8;
        expires 1h;
    }
}
