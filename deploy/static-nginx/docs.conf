# docs.sandfort.dev: key docs.conf of the ConfigMap sandfort-static-nginx.
# Deploy with: deploy/redeploy-beta.sh nginx
#
# The Deployments that mount this ConfigMap live outside the repo, on the beta cluster:
# sandfort-docs (this file, key docs.conf) and sandfort-landing (key landing.conf). Both
# read ConfigMap sandfort-static-nginx, so a key or ConfigMap rename needs a change there too.
#
# Clean URLs: /guide is served from guide.html. Unknown paths answer with 404.html, the
# not-found page that scripts/build_docs_site.py writes at the site root.
#
# Cache rules: html is never cached (`expires epoch`). The spec, scripts and stylesheet use
# max-age=300 with must-revalidate, so a deploy shows up within five minutes. `expires` cannot
# add must-revalidate, so that location sets Cache-Control with add_header and repeats the
# security headers: add_header inside a location drops those inherited from the server block.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Redirects carry a relative Location: TLS ends at the ingress, so an absolute one would
    # name http:// and cost an extra hop.
    absolute_redirect off;

    set $csp "script-src 'self' https://cdn.jsdelivr.net https://umami.sandfort.dev;";
    set $csp "${csp} worker-src blob:;";
    set $csp "${csp} style-src 'self' 'unsafe-inline';";
    set $csp "${csp} font-src data:;";
    set $csp "${csp} img-src 'self' data: https://cdn.redoc.ly;";
    set $csp "${csp} connect-src 'self' https://umami.sandfort.dev;";
    set $csp "${csp} base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp always;

    error_page 404 /404.html;

    # The not-found page is not a page of its own: a direct request for /404 or /404.html
    # answers 404 (internal locations refuse outside requests), and error_page above still
    # serves the page, with status 404, for every miss. The page is never cached.
    location = /404 { internal; }
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
    }

    # The API reference is the index page; /api and /api/ are the addresses people guess.
    # /api serves the index in place; /api/ must redirect, because the index page's assets
    # and links are relative and would otherwise resolve under /api/ and answer 404.
    location = /api { try_files /index.html =404; }
    location = /api/ { return 301 /; }
    # /docs is a guessed address too (the host is already docs.sandfort.dev). /docs/ is covered
    # by the trailing-slash rule below and redirects to /docs, which lands here.
    location = /docs { return 301 /; }
    # The site is flat (no directories), so /guide/ means /guide: redirect, never 404.
    location ~ ^(/[^/.]+)/$ { return 301 $1; }
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(json|js|css)$ {
        add_header Cache-Control "max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
    }

    location ~* \.html$ {
        expires epoch;
    }
}
