# Production profile: API + Postgres 16.
#   POSTGRES_PASSWORD=<url-safe secret> DOCKER_GID=$(stat -c %g /var/run/docker.sock) \
#     docker compose -f deploy/compose.prod.yml up -d --build
# deploy/sandfort.env (not committed) sets SANDFORT_API_KEY_PEPPER and the host capacity that
# prod requires (the server refuses to start with either at zero). Example, for an 8 vCPU /
# 16 GiB host; use your own figures and leave headroom for the OS, Docker and this stack:
#   SANDFORT_API_KEY_PEPPER=<random secret>
#   SANDFORT_HOST_CAPACITY_CPU_MILLICORES=6000
#   SANDFORT_HOST_CAPACITY_MEMORY_MIB=12288
# SANDFORT_ALLOW_UNBOUNDED_HOST=true starts without a host-wide limit; set it only knowingly.

name: sandfort

services:
  api:
    image: sandfort-api  # the name the deploy script retags (:previous is the rollback target)
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # Build on the host network: the default-bridge egress chain installed by
      # deploy/host-setup.sh rejects private ranges, so a build that resolved names through a
      # private upstream (cluster DNS behind systemd-resolved) would fail. The operator's own
      # build must not depend on the bridge rules.
      network: host
      args:
        SANDFORT_BUILD_SHA: "${SANDFORT_BUILD_SHA:-}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./sandfort.env
    environment:
      SANDFORT_ENVIRONMENT: prod
      SANDFORT_DATABASE_URL: "postgresql+asyncpg://sandfort:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/sandfort"
      SANDFORT_DATABASE_POOL_SIZE: "10"
      SANDFORT_DATABASE_MAX_OVERFLOW: "20"
    ports:
      - "127.0.0.1:8000:8000"  # front with a TLS reverse proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw  # Docker driver
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the docker socket group id}"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sandfort
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: sandfort
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandfort -d sandfort"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
