name: Release image

# Builds the API image for every release tag and publishes it to GitHub Container Registry:
#   ghcr.io/malinele/sandfort:<tag>  and  ghcr.io/malinele/sandfort:sha-<short sha>
# The image carries the commit in /app/BUILD_SHA and in the OCI revision label; the deploy
# script verifies that label before it recreates the API container (deploy/redeploy-beta.sh
# --image). Introduced after the 2026-11-10 stale-image incident.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push the API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: |
            SANDFORT_BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/malinele/sandfort:${{ github.ref_name }}
            ghcr.io/malinele/sandfort:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
